<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica de Español</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="theme-color" content="#A8641E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Práctica de Español</h1>
      <button id="settings-btn" class="icon-btn" type="button" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </header>

    <!-- Home -->
    <section id="view-home">
      <div id="api-key-banner" class="banner" hidden>
        <p>Añade tu clave de API de Gemini para empezar a hablar.</p>
        <button id="api-key-banner-btn" class="btn btn-primary" type="button">Añadir clave</button>
      </div>

      <div class="stats-row">
        <div class="stat-tile">
          <span class="stat-value" id="stat-conversations">0</span>
          <span class="stat-label">Conversaciones</span>
        </div>
        <div class="stat-tile">
          <span class="stat-value" id="stat-messages">0</span>
          <span class="stat-label">Mensajes enviados</span>
        </div>
      </div>

      <h2 class="section-title">Elige un escenario</h2>
      <div id="scenario-grid" class="scenario-grid"></div>
    </section>

    <!-- Conversation -->
    <section id="view-conversation" hidden>
      <div class="conv-header">
        <button id="back-btn" class="icon-btn" type="button" title="Volver" aria-label="Volver">←</button>
        <div class="conv-header-info">
          <span id="conv-persona"></span>
          <span id="conv-difficulty-badge" class="badge"></span>
        </div>
      </div>

      <div id="message-list"></div>

      <form id="composer-form">
        <textarea id="composer-input" rows="1" placeholder="Escribe en español…" required></textarea>
        <button id="send-btn" class="send-btn" type="submit" title="Enviar" aria-label="Enviar">➤</button>
      </form>
    </section>
  </div>

  <dialog id="settings-dialog">
    <form id="settings-form" class="dialog-body">
      <h2>Ajustes</h2>

      <div class="field">
        <label for="api-key-input">Clave de API de Gemini</label>
        <input id="api-key-input" type="password" autocomplete="off" placeholder="AIza…">
        <span class="field-hint">Gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Se guarda solo en este dispositivo.</span>
      </div>

      <div class="field">
        <label for="difficulty-select">Dificultad</label>
        <select id="difficulty-select">
          <option value="beginner">Principiante</option>
          <option value="intermediate">Intermedio</option>
          <option value="advanced">Avanzado</option>
        </select>
      </div>

      <div class="field">
        <label for="dialect-select">Variante de español</label>
        <select id="dialect-select">
          <option value="es-ES">España</option>
          <option value="es-MX">México</option>
        </select>
      </div>

      <div class="dialog-actions">
        <button id="settings-cancel-btn" class="btn" type="button">Cancelar</button>
        <button class="btn btn-primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
